name: Diagnose API 502 (temporary)
on:
  push:
    branches: [diag/api-502-715]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-northeast-1
    steps:
      - name: Lambda settings (env vars excluded)
        run: |
          aws lambda get-function-configuration --function-name uchi-stock-app-dev-getItems \
            --query '{Runtime:Runtime,Handler:Handler,State:State,StateReason:StateReason,LastUpdateStatus:LastUpdateStatus,LastUpdateStatusReason:LastUpdateStatusReason,CodeSize:CodeSize,LastModified:LastModified,Timeout:Timeout,Memory:MemorySize}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Invoke getItems directly
        run: |
          echo '{"headers":{}}' > payload.json
          aws lambda invoke --function-name uchi-stock-app-dev-getItems --cli-binary-format raw-in-base64-out --payload file://payload.json out.json --query '{Status:StatusCode,FnError:FunctionError}' | tee -a "$GITHUB_STEP_SUMMARY"
          head -c 1500 out.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Recent logs
        run: |
          aws logs tail /aws/lambda/uchi-stock-app-dev-getItems --since 3h 2>&1 | grep -v "^$" | tail -40 | cut -c1-300 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: API Gateway deployment and stage
        run: |
          id=$(aws apigateway get-rest-apis --query "items[?name=='dev-uchi-stock-app'].id" --output text)
          echo "restApiId=$id" | tee -a "$GITHUB_STEP_SUMMARY"
          aws apigateway get-stage --rest-api-id "$id" --stage-name dev --query '{Deployment:deploymentId,LastUpdated:lastUpdatedDate}' | tee -a "$GITHUB_STEP_SUMMARY"
          aws apigateway get-deployments --rest-api-id "$id" --query 'items[0:3].{Id:id,Created:createdDate}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stack events
        run: |
          aws cloudformation describe-stack-events --stack-name uchi-stock-app-dev --max-items 12 \
            --query 'StackEvents[].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' --output text | cut -c1-250 | tee -a "$GITHUB_STEP_SUMMARY"
