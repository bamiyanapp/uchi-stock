name: Diagnose API 502 (temporary)
on:
  push:
    branches: [diag/api-502-715]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-northeast-1
    steps:
      - name: Try runtimes with the deployed package
        run: |
          set -u
          role=$(aws lambda get-function-configuration --function-name uchi-stock-app-dev-getItems --query Role --output text)
          url=$(aws lambda get-function --function-name uchi-stock-app-dev-getItems --query Code.Location --output text)
          curl -sS -o code.zip "$url"
          echo '{"headers":{}}' > payload.json
          try() {
            name=$1; runtime=$2; envjson=$3
            aws lambda create-function --function-name "$name" --runtime "$runtime" --role "$role" --handler handler.getItems \
              --zip-file fileb://code.zip --timeout 15 --memory-size 512 --environment "$envjson" --query State --output text
            aws lambda wait function-active-v2 --function-name "$name"
            echo "== $runtime env=$envjson" | tee -a "$GITHUB_STEP_SUMMARY"
            aws lambda invoke --function-name "$name" --cli-binary-format raw-in-base64-out --payload file://payload.json out.json --query '{Status:StatusCode,FnError:FunctionError}' | tee -a "$GITHUB_STEP_SUMMARY"
            head -c 600 out.json | tee -a "$GITHUB_STEP_SUMMARY"; echo | tee -a "$GITHUB_STEP_SUMMARY"
            aws lambda delete-function --function-name "$name"
          }
          try uchi-diag-node24 nodejs24.x '{"Variables":{"NODE_ENV":"production"}}' || true
          try uchi-diag-node22flag nodejs22.x '{"Variables":{"NODE_OPTIONS":"--experimental-require-module"}}' || true
      - name: Cleanup leftovers
        if: always()
        run: |
          for n in uchi-diag-node24 uchi-diag-node22flag; do aws lambda delete-function --function-name "$n" 2>/dev/null || true; done
