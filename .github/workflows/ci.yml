name: CI
run-name: >-
  CI (${{ github.event_name == 'pull_request' && 'PR' || 'push-to-main' }})
  ${{ github.event.head_commit.message || github.event.pull_request.title }}

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.116.0
    with:
      self_ref: v2.116.0
      frontend_dir: frontend
      backend_dir: backend
      node_version: "22"
      enable_e2e_test: true
      enable_duplication_check: true
      enable_mermaid_render: true
      mermaid_doc_paths: "docs/internal-design.md"
      enable_standards_check: true
      # frontend_dir/backend_dir形式のため両方のジョブに共通で適用される。
      # frontend実測値（lines 65.05%・statements 63.46%）に余裕を持たせつつ、
      # branches/functionsはfrontend側が低すぎるため対象外にする（uchi-stock issue #637）。
      # frontendのテスト厚み自体の改善は別issueで段階的に行う
      coverage_threshold: 60
      coverage_metrics: "lines,statements"
      # 重複解消後の実測値（lines 1.70%）に十分な余裕を持たせた目標閾値（uchi-stock issue #422）
      duplication_threshold: 5
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
