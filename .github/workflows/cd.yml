name: CD
# dev-standardsのCD run-name規約（docs/cicd-pipeline-specification.md
# 「2. CDワークフロー」）に倣い、コミットSHAの羅列ではなく内容が分かる
# 表示にする（issue #337）
run-name: >-
  CD (${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }})
  ${{ github.event.workflow_run.head_commit.message }}

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      force_seed:
        description: 'Force seeding of data'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.workflow_run.conclusion == 'success'
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Debug git state
        run: |
          git status -sb
          git log --oneline -5
          git tag --sort=-v:refname | head -5
      - name: Handle tag conflict
        run: |
          git fetch --tags --force
          # 最新のタグが現在のHEADの履歴に含まれていない場合、
          # semantic-release がタグの重複エラーで失敗するのを防ぐため、
          # fake merge (-s ours) を行い履歴を繋げる。
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)
          if [ -n "$LATEST_TAG" ]; then
            if ! git merge-base --is-ancestor "$LATEST_TAG" HEAD; then
              echo "Warning: $LATEST_TAG is not an ancestor of HEAD. Performing a fake merge to ensure continuity."
              git config user.name "github-actions"
              git config user.email "github-actions@github.com"
              git merge -s ours "$LATEST_TAG" --no-edit || echo "Merge failed, but proceeding..."
            fi
          fi
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
          DEBUG: semantic-release:*
        run: npx semantic-release
      # .releaserc.cjsに@semantic-release/npmが無くpackage.jsonのversionは
      # 更新されないため、実際にリリースされたバージョンをgit tagから
      # 取得する。このジョブのチェックアウトはコミットしないため、
      # git historyには一切影響しない（issue #348、frontend側で
      # トップページに表示するバージョンがpackage.json更新の仕組み
      # 不在によりリリースのたびに乖離していた問題への対応）
      - name: Get released version
        id: get-version
        run: |
          TAG=$(git tag --points-at HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$TAG" ]; then
            # このpushではリリース対象のコミット（feat/fix等）が無く新規
            # タグが発行されなかった。その場合は既存の最新タグ（＝現在
            # 実際にデプロイされているバージョン）を使う
            TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  changelog:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: release
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # 全タグから CHANGELOG 再生成
      - name: Generate full CHANGELOG
        run: |
          npx conventional-changelog \
            -p conventionalcommits \
            -i CHANGELOG.md \
            -s \
            -r 0
      # scripts/convert-changelog-to-json.jsはリポジトリに常駐させず、dev-standards側の
      # 最新版をCD実行のたびにコピーして使う（issue #233）
      - name: Checkout dev-standards (for the local composite action)
        uses: actions/checkout@v7
        with:
          repository: bamiyanapp/dev-standards
          ref: v1.15.1
          path: .dev-standards-actions
      - name: Copy changelog-to-JSON conversion script
        uses: ./.dev-standards-actions/.github/actions/copy-changelog-script
      # JSON 変換（任意）
      - name: Convert changelog to JSON
        env:
          CHANGELOG_SOURCE_PATH: CHANGELOG.md
          CHANGELOG_JSON_OUTPUT_PATH: frontend/src/changelog.json
        run: node scripts/convert-changelog-to-json.js
      - name: Commit & push to release
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add CHANGELOG.md frontend/src/changelog.json
          git commit -m "docs(changelog): ${{ github.ref_name }}" || exit 0
          git push origin release

  build-and-deploy-frontend:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    # フロントエンドビルド用のsecretsは、複合action呼び出しステップの環境変数としてではなく
    # job単位のenvとして設定する（複合action内部のrunステップへ確実に伝播させるため。
    # 呼び出し元ステップのenv:はrunステップとは異なり複合action内部へ伝播しない）
    env:
      VITE_USER_POOL_ID: ${{ secrets.VITE_USER_POOL_ID }}
      VITE_USER_POOL_CLIENT_ID: ${{ secrets.VITE_USER_POOL_CLIENT_ID }}
      VITE_AUTH_DOMAIN: ${{ secrets.VITE_AUTH_DOMAIN }}
      VITE_REDIRECT_SIGN_IN: ${{ secrets.VITE_REDIRECT_SIGN_IN }}
      VITE_REDIRECT_SIGN_OUT: ${{ secrets.VITE_REDIRECT_SIGN_OUT }}
    steps:
      # PR #320でfrontend/src/components/UpdateNotifier.jsx・frontend/public/sw.jsを
      # dev-standards submodule（shared/pwa/）へのsymlinkとして追加した。submodules: true
      # を指定しないとリンク先が存在せずViteビルドがUNRESOLVED_IMPORTで失敗する
      # （issue #333、CI側は既にenable_standards_check: trueで対応済みだったが
      # cd.yml側の同種のcheckoutには反映漏れがあった）
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Checkout dev-standards (for the local composite action)
        uses: actions/checkout@v7
        with:
          repository: bamiyanapp/dev-standards
          ref: v1.15.1
          path: .dev-standards-actions
      # frontend/getAppVersionDefine.js（symlink）がビルド時にルートの
      # package.jsonのversionを読み込みトップページへ埋め込む（issue #339）。
      # package.jsonのversionはreleaseジョブでは更新されないため、実際に
      # リリースされたバージョン（releaseジョブのoutputs.version）を
      # このジョブのチェックアウト内でのみ反映する。コミット・pushは
      # 行わないためgit historyには影響しない（issue #348）
      - name: Sync root package.json version for build-time embedding
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.version = process.env.RELEASE_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
      - name: 🚀 Build and Deploy to GitHub Pages
        id: deploy
        uses: ./.dev-standards-actions/.github/actions/deploy-github-pages
        with:
          working-directory: frontend
          node-version: "24"
          artifact-path: frontend/dist
      - name: Show GitHub Pages URL
        run: |
          echo "Pages URL: ${{ steps.deploy.outputs.page-url }}"

  deploy-backend:
    needs: release
    runs-on: ubuntu-latest
    env:
      SLS_INTERACTIVE_SETUP_ENABLE: false
      CI: true
      SLS_TTY: false
      TERM: dumb
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Root dependencies
        run: npm ci
      - name: Install Backend dependencies
        working-directory: backend
        run: npm ci
      - name: 🛡️ Check for Destructive Changes
        run: node scripts/check-destructive-changes.js
        env:
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy || 'false' }}
      - name: 💾 Backup DynamoDB
        run: |
          # Extract table names using a robust inline script that handles ANSI noise and JSON parsing
          # Pipe to cat to suppress TTY/spinner features
          TABLE_NAMES=$(cd backend && npx serverless print --format json | cat | node -e "const input = require('fs').readFileSync(0, 'utf8').replace(/[\u001b\u009b][[()#;?]*(?:[0-9]{1,4}(?:;[0-9]{0,4})*)?[0-9A-ORZcf-nqry=><]/g, ''); const match = input.match(/\{[\s\S]*\}/); if (match) { const config = JSON.parse(match[0]); const resources = config.resources?.Resources || {}; const tableNames = Object.values(resources).filter(res => res.Type === 'AWS::DynamoDB::Table').map(res => res.Properties.TableName); console.log(tableNames.join(' ')); }")
          if [ -n "$TABLE_NAMES" ]; then
            node scripts/backup-dynamodb.js $TABLE_NAMES
          else
            echo "No DynamoDB tables found to backup."
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-1
      - name: 🚀 Deploy Backend (Serverless Framework)
        working-directory: backend
        run: npx serverless deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  seed-backend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Backend dependencies
        working-directory: backend
        run: npm ci
      - name: 🌱 Seed Database
        if: ${{ inputs.force_seed == true || github.event.inputs.force_seed == 'true' }}
        working-directory: backend
        run: node seed.js --clear
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: 🧪 Seed Test Data for Stock Prediction
        if: ${{ inputs.force_seed == true || github.event.inputs.force_seed == 'true' }}
        working-directory: backend
        run: node seed-test-stock-prediction.js --clear
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
